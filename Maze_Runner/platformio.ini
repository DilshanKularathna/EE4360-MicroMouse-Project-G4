; ============================================================================
; PlatformIO Project Configuration File
; EE4360 - Maze Solver Challenge Project 2026
; ============================================================================
;
;   pio run                     -> build firmware
;   pio run -t upload           -> flash the Arduino Mega
;   pio device monitor          -> open serial monitor (115200 baud)
;   pio test -e native          -> run the arena simulator tests on the PC
;   pio run -e native -t exec   -> arena simulator stress report
;
; ============================================================================

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps =

; ============================================================================
; Native (PC) environment: competition-arena simulator for the maze explorer
;   pio test -e native            -> spec acceptance tests (test/test_arena_spec)
;   pio run  -e native -t exec    -> stress report over 500 random arenas
; ============================================================================
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    -<*>
    +<../simulation/spec_runner.cpp>
test_build_src = no
lib_deps =
    MazeExplorer
lib_ignore =
    Gyro
    IRArray
    LineFollower
    Motion
    MotorDriver
    Ultrasonic

