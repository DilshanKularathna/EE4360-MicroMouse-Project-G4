; ============================================================================
; PlatformIO Project Configuration File
; EE4360 - Maze Solver Challenge Project 2026
; ============================================================================
;
;   pio run                     -> build firmware
;   pio run -t upload           -> flash the Arduino Mega
;   pio device monitor          -> open serial monitor (115200 baud)
;   pio test -e native          -> run hardware-independent unit tests on host
;
; ============================================================================

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps =

; [env:native]
; platform = native
; build_flags =
;     -std=c++17
;     -I include
;     -I lib/MazeMapper
; test_filter = test_maze_mapper
; test_build_src = no
; lib_ignore =
;     MazeMotorDriver
;     MazeEncoder
;     MazeUltrasonicSensor
;     MazeLineSensorArray
;     MazeGyroMPU6050
;     MazePIDController
;     MazeNavigator
;     MazeBridgeHandler
;     MazeRobotFSM
;     MazePersistentStore

;; ============================================================================
; Motor Test Environment
; ============================================================================

[env:motor_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries

build_src_filter = 
    -<*> 
    ;+<../Arduino_Test/motor_test/motor_01.cpp>
    ; +<../Arduino_Test/motor_test/motor_02.cpp>
    ;+<../Arduino_Test/motor_test/maze_test_01.cpp>
    ; +<../Arduino_Test/motor_test/motor_forward_test.cpp>
    ; +<../Arduino_Test/motor_test/motor_calibration.cpp>
    ; +<../Arduino_Test/motor_test/turn_test.cpp>
    ; +<../Arduino_Test/motor_test/turn_autotune.cpp>
    ; +<../Arduino_Test/motor_test/straight_test.cpp>
    ; +<../Arduino_Test/motor_test/square_test.cpp>
    +<../Arduino_Test/ultrasonic_test/ultrasonic_calibration.cpp>
    ; +<../Arduino_Test/gyro_test/gyro_test.cpp>

[env:irarray_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries

build_src_filter = 
    -<*> 
    +<../Arduino_Test/irarray_test/ir_02.cpp>

; LineFollower library test: marker cell + line mode
[env:line_mode_test]
extends = env:irarray_test
build_src_filter =
    -<*>
    +<../Arduino_Test/irarray_test/line_mode_test.cpp>

[env:maze_solve_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries

build_src_filter =
    -<*>
    +<../Arduino_Test/maze_solve_test/maze_solver_small.cpp>

; ---- Straight-line tuning stages (guide: Doc/straight_tuning.md) ----
;   pio run -e tune1_distance -t upload
[env:tune1_distance]
extends = env:maze_solve_test
build_flags = ${env:maze_solve_test.build_flags} -DTUNE_STAGE=1 -DTUNE_CELLS=1

[env:tune2_encoder]
extends = env:maze_solve_test
build_flags = ${env:maze_solve_test.build_flags} -DTUNE_STAGE=2 -DTUNE_CELLS=4

[env:tune3_gyro]
extends = env:maze_solve_test
build_flags = ${env:maze_solve_test.build_flags} -DTUNE_STAGE=3 -DTUNE_CELLS=4

[env:tune4_walls]
extends = env:maze_solve_test
build_flags = ${env:maze_solve_test.build_flags} -DTUNE_STAGE=4 -DTUNE_CELLS=4