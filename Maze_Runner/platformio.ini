[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
build_src_filter =
    +<*>
    -<Arduino_Test/>

[env:motor_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
build_src_filter =
    -<*>
    +<../Arduino_Test/gyroscope_test/gyroscope_calibration_test.cpp>