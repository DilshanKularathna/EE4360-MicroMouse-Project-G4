; ============================================================================
; PlatformIO Project Configuration File
; EE4360 - Maze Solver Challenge Project 2026
; ============================================================================
;
;   pio run                     -> build firmware
;   pio run -t upload           -> flash the Arduino Mega
;   pio device monitor          -> open serial monitor (115200 baud)
;   pio test -e native          -> run hardware-independent unit tests on host
;
; ============================================================================

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps =
build_src_filter =
    +<*>
    -<Arduino_Test/>

; [env:native]
; platform = native
; build_flags =
;     -std=c++17
;     -I include
;     -I lib/MazeExplorer
; test_filter = test_maze_mapper
; test_build_src = no
; lib_ignore =
;     MazeMotorDriver
;     MazeEncoder
;     MazeUltrasonicSensor
;     MazeLineSensorArray
;     MazeGyroMPU6050
;     MazePIDController
;     MazeNavigator
;     MazeBridgeHandler
;     MazeRobotFSM
;     MazePersistentStore

