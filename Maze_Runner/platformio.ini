; ============================================================================
; Bench test: serial menu over the real adapter / Motion / LineFollower code
;   pio run -e bench -t upload   then   pio device monitor -e bench
; ============================================================================
[env:bench]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -Wall
    -Wextra
    -Iinclude
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps =
    Gyro
    IRArray
    LineFollower
    MazeExplorer
    Motion
    MotorDriver
    Ultrasonic
build_src_filter =
    -<*>
    +<hardware_adapter.cpp>
    +<../Arduino_Test/bench_test/bench.cpp>

